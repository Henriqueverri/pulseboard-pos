server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pulseboard-pos
  autoconfigure:
    # Users live in the database and authenticate with JWT; no generated in-memory user.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://localhost:5433/pulseboard_pos}
    username: ${POS_DB_USER:pos}
    password: ${POS_DB_PASSWORD:pos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    # Validation messages in Portuguese regardless of the client's Accept-Language.
    locale: pt_BR
    locale-resolver: fixed

pulseboard:
  # Off when disabled or without a key: sales still create PENDING outbox events, delivered later.
  enabled: ${PULSEBOARD_INTEGRATION_ENABLED:true}
  api-url: ${PULSEBOARD_API_URL:http://localhost:8000/api/v1}
  # API Key "pb_..." of the PulseBoard organization. Never commit a real value.
  api-key: ${PULSEBOARD_API_KEY:}
  connect-timeout: 10s
  read-timeout: 30s

pos:
  currency: ${POS_CURRENCY:BRL}
  outbox:
    poll-interval: ${POS_OUTBOX_POLL_INTERVAL:2s}
    batch-size: 20
    # Longer than connect + read timeouts, so a live worker never loses its claim.
    lease: 2m
  security:
    jwt:
      # Required, at least 32 bytes; startup fails otherwise. Never commit a real value.
      secret: ${POS_JWT_SECRET:}
      ttl: 8h
    users:
      admin:
        email: ${POS_ADMIN_EMAIL:}
        password: ${POS_ADMIN_PASSWORD:}
        name: ${POS_ADMIN_NAME:Administrador}
      cashier:
        email: ${POS_CASHIER_EMAIL:}
        password: ${POS_CASHIER_PASSWORD:}
        name: ${POS_CASHIER_NAME:Caixa}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
