server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pulseboard-pos
  autoconfigure:
    # No users exist until F9; avoids the generated in-memory user and its logged password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://localhost:5433/pulseboard_pos}
    username: ${POS_DB_USER:pos}
    password: ${POS_DB_PASSWORD:pos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
