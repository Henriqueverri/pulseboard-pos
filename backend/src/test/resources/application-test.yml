pos:
  outbox:
    # Tests run the worker explicitly (OutboxWorker.runOnce) instead of on a schedule.
    scheduler-enabled: false
  security:
    jwt:
      secret: test-only-secret-0123456789abcdef0123456789abcdef
    users:
      admin:
        email: admin@test.pos.example
        password: admin-test-password
        name: Admin de Teste
      cashier:
        email: caixa@test.pos.example
        password: caixa-test-password
        name: Caixa de Teste

pulseboard:
  # Points to the WireMock server started by ApiIntegrationTest; a fake, test-only key in the
  # pb_<12-char prefix>_<40-char secret> format.
  api-key: pb_testprefix00_faketestonlykeynotasecret000000000000000
  connect-timeout: 2s
  read-timeout: 1s
